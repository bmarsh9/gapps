# =============================================================================
# Nginx Reverse Proxy Config for Cloudways
# =============================================================================
# On Cloudways, paste this into:
#   Application Settings > Varnish & Nginx > NGINX DIRECTIVES (Custom)
#
# This proxies incoming HTTPS traffic to the Gunicorn app on port 5000.
# =============================================================================

location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120;
    proxy_connect_timeout 120;
    proxy_send_timeout 120;

    # WebSocket support (if needed for future features)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# Static files - serve directly for performance
location /static/ {
    alias /home/master/applications/YOUR_APP_NAME/public_html/app/static/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}
